<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài học — Phong Menly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--panel:#0f0f10;--card:#141416;
  --gold:#FFD700;--gold-l:#FFE566;--org:#FF7B00;--grn:#4ADE80;
  --txt:#fff;--muted:#A1A1AA;--dim:#52525B;
  --bdr:rgba(255,215,0,.22);--bdr-s:rgba(255,255,255,.07);--asw:380px
}
html{scroll-behavior:smooth}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;min-height:100vh}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}

/* TOPBAR */
.topbar{height:60px;border-bottom:1px solid var(--bdr-s);background:rgba(8,8,8,.9);backdrop-filter:blur(16px);position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:0 22px}
.back-btn{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:700;padding:8px 14px;border-radius:8px;transition:.18s;white-space:nowrap}
.back-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.tb-title{font-size:15px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.tb-prog{display:flex;align-items:center;gap:10px;flex-shrink:0}
.tb-track{width:120px;height:7px;background:rgba(255,255,255,.08);border-radius:50px;overflow:hidden}
.tb-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--gold),var(--org));transition:width .6s}
.tb-pct{font-size:12px;font-weight:800;color:var(--gold)}
.aside-btn{display:none;background:none;border:none;color:#fff;font-size:22px;cursor:pointer}

/* LAYOUT */
.wrap{display:flex;min-height:calc(100vh - 60px)}
.main{flex:1;min-width:0;padding:26px 30px 60px;max-width:1100px;margin:0 auto;width:100%}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--bdr-s);display:flex;align-items:center;justify-content:center}
.video-box video{width:100%;height:100%;object-fit:contain;background:#000}
.video-box iframe{width:100%;height:100%;border:0;display:block;background:#000}
.vb-ph{text-align:center;padding:20px}
.vb-ph .vb-ico{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--org));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 12px 36px rgba(255,123,0,.4)}
.vb-ph .vb-ico svg{width:30px;height:30px;fill:#000;margin-left:4px}
.vb-ph h3{font-size:18px;font-weight:800;margin-bottom:6px}
.vb-ph p{font-size:13.5px;color:var(--muted)}
.lesson-head{margin:24px 0 4px}
.lh-kick{font-size:12px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.lh-title{font-size:clamp(20px,2.6vw,28px);font-weight:900;letter-spacing:-.5px;line-height:1.2;margin-top:6px}
.lh-meta{display:flex;align-items:center;gap:16px;margin-top:10px;font-size:13px;color:var(--muted);font-weight:600}
.lh-meta span{display:flex;align-items:center;gap:6px}
.lesson-desc{margin-top:18px;font-size:14.5px;color:var(--muted);line-height:1.85;background:var(--card);border:1px solid var(--bdr-s);border-radius:14px;padding:20px 22px}
.actions{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;border:none;font-family:inherit;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--org));color:#000}
.btn.gold:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.line{background:transparent;border:1px solid var(--bdr-s);color:#fff}
.btn.line:hover{border-color:var(--bdr);background:rgba(255,255,255,.04)}
.btn.done{background:rgba(74,222,128,.14);color:var(--grn);border:1px solid rgba(74,222,128,.3)}
.nav-row{margin-left:auto;display:flex;gap:10px}

/* ASIDE */
.aside{width:var(--asw);flex-shrink:0;border-left:1px solid var(--bdr-s);background:var(--panel);padding:24px 20px;overflow-y:auto;max-height:calc(100vh - 60px);position:sticky;top:60px}
.as-head{margin-bottom:18px}
.as-kick{font-size:11px;font-weight:800;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.as-title{font-size:18px;font-weight:900;margin-top:5px;line-height:1.25}
.as-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.les{display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:12px;cursor:pointer;transition:.16s;border:1px solid transparent;margin-bottom:4px}
.les:hover{background:rgba(255,255,255,.04)}
.les.active{background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,123,0,.05));border-color:var(--bdr)}
.les-num{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted);flex-shrink:0;transition:.16s}
.les.active .les-num{background:linear-gradient(135deg,var(--gold),var(--org));color:#000}
.les.done .les-num{background:rgba(74,222,128,.18);color:var(--grn)}
.les-info{min-width:0;flex:1}
.les-t{font-size:13.5px;font-weight:700;color:#fff;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.les.active .les-t{color:var(--gold)}
.les-d{font-size:11.5px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:6px}
.les-check{width:18px;height:18px;flex-shrink:0;opacity:0}
.les.done .les-check{opacity:1}
.les-check svg{width:18px;height:18px;stroke:var(--grn);fill:none;stroke-width:2.4}

.aside-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55}

/* RESPONSIVE */
@media(max-width:980px){
  :root{--asw:320px}
  .main{padding:22px 18px 50px}
}
@media(max-width:760px){
  .wrap{display:block}
  .aside{position:fixed;top:0;right:0;bottom:0;width:300px;max-height:100vh;transform:translateX(100%);transition:transform .25s;z-index:60;padding-top:20px}
  .aside.open{transform:translateX(0)}
  .aside-ov.open{display:block}
  .aside-btn{display:block}
  .tb-prog{display:none}
  .back-btn span.lbl{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <a href="hoc-vien.html" class="back-btn">← <span class="lbl">Học Viện</span></a>
  <div class="tb-title" id="tb-title">Đang tải…</div>
  <div class="tb-prog">
    <div class="tb-track"><div class="tb-fill" id="tb-fill"></div></div>
    <span class="tb-pct" id="tb-pct">0%</span>
  </div>
  <button class="aside-btn" onclick="toggleAside()">☰</button>
</header>

<div class="aside-ov" id="aside-ov" onclick="toggleAside()"></div>

<div class="wrap">
  <main class="main">
    <div class="video-box" id="video-box">
      <div class="vb-ph">
        <div class="vb-ico"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></div>
        <h3>Bài học đang được cập nhật</h3>
        <p>Video sẽ sẵn sàng khi khóa học ra mắt chính thức.</p>
      </div>
    </div>

    <div class="lesson-head">
      <div class="lh-kick" id="lh-kick">Bài 1</div>
      <h1 class="lh-title" id="lh-title">—</h1>
      <div class="lh-meta">
        <span>⏱ <span id="lh-dur">--:--</span></span>
        <span>📘 <span id="lh-course">—</span></span>
      </div>
    </div>

    <div class="lesson-desc" id="lh-desc">—</div>

    <div class="actions">
      <button class="btn gold" id="btn-done" onclick="toggleDone()">✓ Đánh dấu hoàn thành</button>
      <div class="nav-row">
        <button class="btn line" id="btn-prev" onclick="go(-1)">← Bài trước</button>
        <button class="btn line" id="btn-next" onclick="go(1)">Bài sau →</button>
      </div>
    </div>
  </main>

  <aside class="aside" id="aside">
    <div class="as-head">
      <div class="as-kick" id="as-kick">Combo</div>
      <div class="as-title" id="as-title">—</div>
      <div class="as-sub" id="as-sub">0 / 0 bài đã hoàn thành</div>
    </div>
    <div id="les-list"></div>
  </aside>
</div>

<script>
// ════ DỮ LIỆU KHÓA HỌC + BÀI ════
const COURSES = {
  c1:{kick:'Mật Mã Tư Duy', name:'Mật Mã Tư Duy', lessons:[
    {t:'Vì sao 95% người làm affiliate thất bại', d:'11:20'},
    {t:'Cài đặt hệ điều hành tư duy mới', d:'14:05'},
    {t:'Định luật đòn bẩy AI', d:'09:48'},
    {t:'Tư duy hệ thống vs làm tay', d:'12:33'},
    {t:'Cam kết & lộ trình 90 ngày', d:'08:15'}
  ]},
  c2:{kick:'Mật Mã Affiliate Marketing', name:'Mật Mã Affiliate Marketing', lessons:[
    {t:'Bản đồ những ngách có tiền', d:'13:10'},
    {t:'Dùng AI quét nhu cầu thị trường', d:'15:42'},
    {t:'Chấm điểm ngách trong 10 phút', d:'10:05'},
    {t:'Chọn sản phẩm affiliate chuẩn', d:'12:20'},
    {t:'Xác thực ngách bằng dữ liệu', d:'09:30'},
    {t:'Khóa ngách & định vị', d:'07:55'}
  ]},
  c3:{kick:'Mật Mã Traffic', name:'Mật Mã Traffic', lessons:[
    {t:'Nguyên lý cỗ máy content', d:'10:40'},
    {t:'Thiết lập AI Agent viết bài', d:'16:25'},
    {t:'Bộ prompt content thực chiến', d:'18:10'},
    {t:'Lịch nội dung tự động', d:'11:05'},
    {t:'Biến 1 ý tưởng thành 20 bài', d:'13:48'},
    {t:'Tối ưu hook & tiêu đề', d:'09:22'},
    {t:'Phân phối đa nền tảng', d:'12:15'},
    {t:'Đo lường & nhân bản', d:'10:30'}
  ]},
  c4:{kick:'Mật Mã Phễu', name:'Mật Mã Phễu — Master Sale', lessons:[
    {t:'Giải phẫu phễu bán hàng AI', d:'12:50'},
    {t:'Trang đích chuyển đổi cao', d:'15:18'},
    {t:'Email & Zalo nuôi tự động', d:'14:02'},
    {t:'Kéo traffic thụ động', d:'13:35'},
    {t:'Chốt đơn bằng AI', d:'11:48'},
    {t:'Tối ưu tỉ lệ chuyển đổi', d:'10:12'},
    {t:'Lắp ráp phễu hoàn chỉnh', d:'16:40'}
  ]},
  c5:{kick:'Mật Mã Tự Do', name:'Mật Mã Tự Do', lessons:[
    {t:'Tư duy scale hệ thống', d:'11:30'},
    {t:'Build KOL AI nhận diện', d:'17:20'},
    {t:'Sản xuất TVC bằng AI', d:'19:05'},
    {t:'Tự động hóa toàn quy trình', d:'15:45'},
    {t:'Giao việc cho AI Agent', d:'12:10'},
    {t:'Dashboard theo dõi hệ thống', d:'10:35'},
    {t:'Nhân bản sang nhiều ngách', d:'13:22'},
    {t:'Dòng tiền thụ động', d:'11:08'},
    {t:'Sống tự do — hệ thống chạy khi bạn ngủ', d:'09:50'}
  ]}
};

const qs = new URLSearchParams(location.search);
let cid = qs.get('c') || 'c1';
if(!COURSES[cid]) cid = 'c1';

// Gate: cho vào nếu có mật mã (mở tất cả) HOẶC đã mua riêng combo này
function courseUnlocked(id){
  if(localStorage.getItem('kh_unlocked')==='1') return true;
  try{ const u=JSON.parse(localStorage.getItem('unlk_'+id)||'null'); if(u && (!u.exp || u.exp>Date.now())) return true; }catch(e){}
  return false;
}
if(!courseUnlocked(cid)){
  location.replace('hoc-vien.html');
}

const course = COURSES[cid];
let cur = Math.min(Math.max(parseInt(qs.get('l')||'0',10)||0,0), course.lessons.length-1);

function doneSet(){ try{ return new Set(JSON.parse(localStorage.getItem('done_'+cid)||'[]')); }catch(e){ return new Set(); } }
function saveDone(s){ localStorage.setItem('done_'+cid, JSON.stringify([...s])); }

// Lấy ID video từ bất kỳ dạng link YouTube nào (hoặc chính ID)
function ytId(s){
  if(!s) return '';
  const m = String(s).match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : String(s).trim();
}

function render(){
  const done = doneSet();
  const L = course.lessons;
  // topbar + aside head
  document.getElementById('tb-title').textContent = course.name;
  document.getElementById('as-kick').textContent = course.kick;
  document.getElementById('as-title').textContent = course.name;
  document.getElementById('as-sub').textContent = done.size+' / '+L.length+' bài đã hoàn thành';
  const pct = Math.round(done.size/L.length*100);
  document.getElementById('tb-pct').textContent = pct+'%';
  setTimeout(()=>{document.getElementById('tb-fill').style.width=pct+'%';},150);
  // lesson detail
  const les = L[cur];
  // video YouTube (nếu có) — không thì placeholder
  const vb = document.getElementById('video-box');
  const id = ytId(les.yt);
  if(id){
    vb.innerHTML = '<iframe src="https://www.youtube.com/embed/'+id+'?rel=0&modestbranding=1" title="'+les.t.replace(/"/g,'')+'" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
  } else {
    vb.innerHTML = '<div class="vb-ph"><div class="vb-ico"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg></div><h3>Bài học đang được cập nhật</h3><p>Video sẽ sẵn sàng khi khóa học ra mắt chính thức.</p></div>';
  }
  document.getElementById('lh-kick').textContent = 'Bài '+(cur+1)+' / '+L.length;
  document.getElementById('lh-title').textContent = les.t;
  document.getElementById('lh-dur').textContent = les.d;
  document.getElementById('lh-course').textContent = course.kick;
  document.getElementById('lh-desc').textContent = 'Trong bài này bạn sẽ thực hành "'+les.t+'" theo từng bước cùng Phong Menly — kèm prompt/biểu mẫu áp dụng ngay. Hoàn thành bài để mở tiến độ và giữ nhịp lộ trình bản đồ.';
  // done button
  const bd = document.getElementById('btn-done');
  if(done.has(cur)){ bd.className='btn done'; bd.textContent='✓ Đã hoàn thành'; }
  else { bd.className='btn gold'; bd.textContent='✓ Đánh dấu hoàn thành'; }
  // nav buttons
  document.getElementById('btn-prev').disabled = cur===0;
  document.getElementById('btn-next').disabled = cur===L.length-1;
  document.getElementById('btn-prev').style.opacity = cur===0?'.4':'1';
  document.getElementById('btn-next').style.opacity = cur===L.length-1?'.4':'1';
  // list
  document.getElementById('les-list').innerHTML = L.map((l,i)=>`
    <div class="les ${i===cur?'active':''} ${done.has(i)?'done':''}" onclick="select(${i})">
      <div class="les-num">${i+1}</div>
      <div class="les-info">
        <div class="les-t">${l.t}</div>
        <div class="les-d">⏱ ${l.d}</div>
      </div>
      <span class="les-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
    </div>`).join('');
}

function select(i){ cur=i; history.replaceState({},'', '?c='+cid+'&l='+i); render(); window.scrollTo({top:0,behavior:'smooth'}); if(window.innerWidth<=760) toggleAside(true); }
function go(dir){ const n=cur+dir; if(n>=0&&n<course.lessons.length) select(n); }
function toggleDone(){ const s=doneSet(); if(s.has(cur)) s.delete(cur); else s.add(cur); saveDone(s); render(); }
function toggleAside(forceClose){
  const a=document.getElementById('aside'), o=document.getElementById('aside-ov');
  if(forceClose){ a.classList.remove('open'); o.classList.remove('open'); return; }
  a.classList.toggle('open'); o.classList.toggle('open');
}

render();
</script>
</body>
</html>
